<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="posterBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D5A4C" />
      <stop offset="50%" stop-color="#2C4A3E" />
      <stop offset="100%" stop-color="#1B3028" />
    </linearGradient>
  </defs>

  <!-- Rich deep sage canvas -->
  <rect x="0" y="0" width="600" height="900" fill="url(#posterBg)" />

  <!-- Hand-drawn border frame -->
  <rect x="25" y="25" width="550" height="850" fill="none" stroke="#FAF7F2" stroke-width="3" stroke-dasharray="14,8" opacity="0.6" />

  <!-- Giant coffee bean line art background watermark -->
  <path d="M300,180 C440,180 500,280 500,420 C500,580 420,700 300,700 C180,700 100,580 100,420 C100,280 160,180 300,180 Z" fill="none" stroke="#FAF7F2" stroke-width="2" opacity="0.12" />
  <path d="M300,200 C340,320 250,540 300,680" fill="none" stroke="#FAF7F2" stroke-width="3" opacity="0.12" />

  <!-- Coffee Cup Line Drawing -->
  <g transform="translate(200, 340)">
    <ellipse cx="100" cy="80" rx="90" ry="24" fill="#FAF7F2" opacity="0.15" />
    <path d="M20,80 Q25,230 100,230 Q175,230 180,80 Z" fill="#F0EAE1" stroke="#FAF7F2" stroke-width="4" />
    <ellipse cx="100" cy="80" rx="80" ry="20" fill="#5A3A22" stroke="#FAF7F2" stroke-width="3" />
    <ellipse cx="100" cy="80" rx="55" ry="12" fill="#D9886A" opacity="0.75" />
    <!-- Handle -->
    <path d="M175,100 C220,100 220,190 170,190" fill="none" stroke="#FAF7F2" stroke-width="6" stroke-linecap="round" />
    <!-- Steam lines -->
    <path d="M80,50 Q70,20 85,-10 Q95,-40 85,-70" fill="none" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M110,45 Q125,15 110,-15 Q95,-45 115,-75" fill="none" stroke="#FAF7F2" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M135,55 Q145,25 130,-5 Q120,-35 135,-65" fill="none" stroke="#FAF7F2" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Typography Banner at Bottom -->
  <g transform="translate(50, 720)">
    <rect x="0" y="0" width="500" height="90" fill="#FAF7F2" stroke="#1C1917" stroke-width="3" />
    <text x="250" y="42" fill="#2C4A3E" font-family="'Permanent Marker', cursive, sans-serif" font-size="28" text-anchor="middle">BIJI KOPI PILIHAN</text>
    <text x="250" y="70" fill="#1C1917" font-family="'Space Mono', monospace" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">DIRACIK DENGAN HATI SETIAP HARI</text>
  </g>
</svg>
